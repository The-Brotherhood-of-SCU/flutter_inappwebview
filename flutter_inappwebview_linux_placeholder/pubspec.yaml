name: flutter_inappwebview_linux_placeholder
description: "Placeholder Linux implementation of flutter_inappwebview plugin (no native dependencies)."
version: 0.1.0
homepage: https://inappwebview.dev/
repository: https://github.com/pichillilorenzo/flutter_inappwebview/tree/master/flutter_inappwebview_linux_placeholder
issue_tracker: https://github.com/pichillilorenzo/flutter_inappwebview/issues

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview_platform_interface: ^1.4.0-beta.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    implements: flutter_inappwebview
    platforms:
      linux:
        dartPluginClass: LinuxPlaceholderInAppWebViewPlatform
